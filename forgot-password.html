<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password . MealBridge</title>

    <link rel="stylesheet" href="CSS/style.css">

    <link rel="stylesheet" href="CSS/responsive.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body class="login">

    <div class="container">

        <div class="left">

            <img src="IMG/logo-white.png" class="logo-login" alt="MealBridge">

            <div class="left-content">

                <h1>
                    Meal<span class="color">Bridge</span>
                </h1>

                <p class="tagline">
                    Share Food. Share Hope.
                </p>

                <div class="line"></div>

                <h2 class="left-h2">
                    Together, We Can End Food Waste.
                </h2>

                <p class="description">
                    MealBridge connects kind hearts with surplus
                    food to create a better, healthier community.
                </p>

            </div>

            <img src="IMG/login-icons.png" class="bottom-icons" alt="MealBridge">

        </div>


        <div class="right">

            <div class="login-container">

                <h2>
                    Forgot Password?
                </h2>

                <br>

                <p>
                    Enter your email to reset your password.
                </p>

                <br><br>

                <div class="login-content">

                    <div class="group">

                        <label for="resetEmail">
                            Email Address
                        </label>

                        <br><br>
                        <input type="email" id="resetEmail" placeholder="Enter Your Email">

                        <br><br><br>

                        <small id="resetEmailError" class="error"></small>

                    </div>

                </div>

                <br><br><br><br>
                <button type="button" class="login-button" id="resetPasswordBtn">
                    Send Reset Link
                </button>

                <br><br>

                <div id="resetMessage" class="login-message"></div>

                <hr>

                <br>

                <div class="register-line">

                    <p class="last-p">
                        Remember your password?
                    </p>

                    <a href="login.html" class="register-link">
                        Back to Login
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.js"></script>

    <script>

        $(document).ready(function () {

            $("#resetPasswordBtn").click(function () {

                const email =
                    $("#resetEmail")
                        .val()
                        .trim();

                $("#resetEmailError").text("");

                $("#resetMessage").text("");


                if (email === "") {

                    $("#resetEmailError")
                        .text(
                            "Please enter your email address."
                        );

                    return;

                }


                const emailRegex =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                if (!emailRegex.test(email)) {

                    $("#resetEmailError")
                        .text(
                            "Please enter a valid email address."
                        );

                    return;

                }


                /*
                 * Backend password-reset system
                 * should be connected here.
                 */

                $("#resetMessage")
                    .text(
                        "Password reset functionality is ready to be connected to the backend."
                    );

            });

        });

    </script>

</body>

</html>
