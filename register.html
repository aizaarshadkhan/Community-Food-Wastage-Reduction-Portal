<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register . MealBridge</title>

    <!-- Your existing CSS -->
    <link rel="stylesheet" href="CSS/responsive.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Cormorant+Upright:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="IMG/logo.png">

    <style>
        :root {
            /* Brand Colors */
            --primary-color: #065C4B;
            --secondary-color: #081F45;
            /* Background */
            --background: #FCFCFC;
            /* Shadow */
            --shadow: rgba(149, 157, 165, 0.2) 0px 8px 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-image: url(IMG/register-page-bg-left.png), url(IMG/register-page-bg-right.png);
            background-attachment: fixed;
            background-repeat: no-repeat, no-repeat;
            background-size: 47% 100%, 70% 95%;
            background-position: left top, right bottom;
            width: 100%;
            height: 100%;
            background-color: #FAFAFA;
        }

        /* nav bar */

        header {
            border: 2px solid transparent;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: transparent;
            color: var(--secondary-color);
            height: 60px;

        }

        .logo {
            display: flex;
            font-family: "amatic", sans-serif;
            font-weight: 400;
            font-style: normal;
            font-size: 25px;
            cursor: pointer;
            transition: all 0.5s ease;
        }

        .logo:hover {
            transform: translateX(-2px);
        }

        .logo img {
            height: 110px;
            margin-right: 1rem;
            margin-top: 0.4375rem;
        }

        .logo h1 {
            margin-top: 2.1875rem;
            font-size: 2.1875rem;
            color: white;
            font-weight: 600;
        }

        nav ul {
            display: flex;
            list-style: none;
            font-size: 0.875rem;
        }

        nav li {
            margin-left: 1.25rem;
        }

        .login-button {
            border: 1px solid transparent;
            border-radius: 5px;
            background-color: var(--secondary-color);
            width: 60px;
            text-align: center;
            padding: 0.375rem;
            position: relative;
            bottom: 5px;
            transition: all 1s ease;
        }

        nav a {
            color: rgb(255, 253, 253);
            text-decoration: none;
        }

        .login-button:hover {
            background-color: var(--primary-color);
        }

        .color {
            color: var(--primary-color);
        }

        /* register page */
        .container {
            border-radius: 10px;
            box-shadow: var(--shadow);
            min-height: 520px;
            width: 350px;
            margin-top: 3rem;
            margin-left: 4.375rem;
            margin-bottom: 1.5625rem;
            padding: 1.875rem;
            text-align: left;
            background-color: var(--background);
            color: var(--secondary-color);
        }

        .line {
            width: 60px;
            height: 2px;
            background: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .container h2 {
            font-weight: 700;
            margin-bottom: 0.4375rem;
        }

        .container p:first-of-type {
            font-size: 0.8125rem;
            font-weight: 300;
            color: #454444;
            margin-bottom: 0.5rem;
        }

        .role-btn {
            width: 130px;
            height: 40px;
            border: 1px solid #949596;
            box-shadow: var(--shadow);
            border-radius: 5px;
            background: #fff;
            color: var(--secondary-color);
            font-size: 1.2rem;
            cursor: pointer;
            font-weight: 600;
        }

        .active {
            border: 1px solid #1B8B73;
            background-color: #e6e4e4;
        }


        input {
            width: 100%;
            margin-top: 0.3125rem;
            margin-bottom: 0.3125rem;
            height: 30px;
            border: 1px solid rgb(142, 138, 138);
            border-radius: 3px;
            padding: 0.375rem;
        }

        .register-button {
            width: 100%;
            padding: 0.56rem;
            border: none;
            border-radius: 7px;
            background: var(--primary-color);
            color: white;
            font-size: 14px;
            cursor: pointer;
            margin-top: 0.375rem;
            margin-bottom: 0.56rem;
            transition: all 1s ease;
        }

        .register-button:hover {
            background-color: var(--secondary-color);
        }

        .google-button {
            width: 100%;
            padding: 9px;
            border: 1px solid black;
            border-radius: 7px;
            background: white;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 0.5rem;
            margin-bottom: 0.59rem;
            transition: all 1s ease;
            box-shadow: var(--shadow);
        }

        .google-button:hover {
            background-color: var(--secondary-color);
            color: white;
        }

        small {
            font-size: 0.625rem;
            color: #4a4949;
        }

        span {
            color: var(--secondary-color);
            font-weight: 600;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.4375rem;
        }

        h3 {
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>


<body class="register-body">

    <header>
        <nav>

            <div class="logo">

                <img src="IMG/logo-white.png" alt="MealBridge Logo">

                <h1>
                    Meal<span class="color">Bridge</span>
                </h1>

            </div>

            <ul>

                <li>
                    Already have an account?
                </li>

                <li class="login-button">
                    <a href="login.html" target="_blank">
                        Login
                    </a>
                </li>

            </ul>

        </nav>
    </header>


    <div class="container">

        <h2>Create Your Account</h2>

        <div class="line"></div>

        <p>Join MealBridge and be a part of the change</p>

        <div class="line"></div>


        <!-- REGISTER AS -->

        <h3>Register As</h3>

        <div class="btn">

            <button type="button" class="role-btn active" data-role="DONOR">
                Donor
            </button>

            <button type="button" class="role-btn" data-role="RECIPIENT">
                Recipient
            </button>

        </div>


        <!-- DONOR FIELDS -->

        <div id="donorFields">

            <input type="text" id="businessName" placeholder="Business Name">

            <small id="businessNameError" class="error">
            </small>


            <input type="text" id="phone" placeholder="Phone Number">

            <small id="phoneError" class="error">
            </small>

        </div>


        <!-- RECIPIENT FIELDS -->

        <div id="recipientFields" style="display: none;">

            <input type="text" id="ngoName" placeholder="NGO Name">

            <small id="ngoNameError" class="error">
            </small>


            <input type="text" id="contactPerson" placeholder="Contact Person">

            <small id="contactPersonError" class="error">
            </small>


            <input type="text" id="recipientPhone" placeholder="Phone Number">

            <small id="recipientPhoneError" class="error">
            </small>

            <!-- NGO Verification Document (Input requirement for NGO verification) -->
            <div class="doc-upload-box" style="margin-top: 8px; margin-bottom: 8px; text-align: left;">
                <label for="ngoDoc"
                    style="font-size: 11px; font-weight: 600; color: #333; display: block; margin-bottom: 2px;">
                    Verification Document (PDF/Image) *
                </label>
                <input type="file" id="ngoDoc" accept=".pdf,image/png,image/jpeg,image/jpg"
                    style="padding: 4px; font-size: 11px; height: auto;">
                <small id="ngoDocError" class="error"></small>
            </div>

        </div>


        <!-- COMMON FIELDS -->

        <input type="email" id="email" placeholder="Email Address">

        <small id="emailError" class="error">
        </small>


        <input type="text" id="address" placeholder="Address">

        <small id="addressError" class="error">
        </small>


        <!-- LOCATION -->

        <button type="button" id="locationButton">

            <i class="fa-solid fa-location-dot"></i>
            Use My Location

        </button>

        <small id="locationError" class="error">
        </small>


        <!-- Hidden location values -->

        <input type="hidden" id="latitude">

        <input type="hidden" id="longitude">


        <!-- PASSWORD -->

        <input type="password" id="password" placeholder="Password">

        <small id="passwordError" class="error">
        </small>


        <input type="password" id="confirm-password" placeholder="Confirm Password">

        <small id="confirmPasswordError" class="error">
        </small>


        <!-- REGISTER -->

        <button type="button" class="register-button">

            Register

        </button>


        <p class="register-success"></p>


        <hr>


        <!-- GOOGLE -->

        <button type="button" class="google-button">

            Continue with Google

        </button>

        <br>


        <small>
            By registering, you agree to our
            <span>Terms and Condition</span>
            and
            <span>Privacy Policies</span>
        </small>

    </div>


    <!-- jQuery -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.js"></script>

    <!-- Your JavaScript -->

    <script src="JS/script.js"></script>

</body>

</html>
